# AOIs for Radar Waltz. center = [lat, lon], size_km = square side.
sites:
  - id: abu-dhabi
    name: Abu Dhabi coast
    center: [24.45, 54.45]
    size_km: 35
    change_type: human-driven (coastal reclamation, urban growth, mangrove planting)
    status: primary
    products: [GCOV]
    stack: {track: 56, dir: A, frame: 14, bw: "40+5"}   # confirmed at gate 1
    # Rewind radar: one S1 relative orbit, October (dry) each year. Orbit 130 A is the only one with a
    # full-AOI October pass in every year 2015 to 2026 (survey 2026-11-15). The 2015 and 2016 passes are VV-only, so the dual-pol series starts in 2017.
    s1: {orbit: 130, dir: A, month: 10}
    # Rewind optical: Landsat winter composites (Nov to Mar, less dust haze than summer).
    optical: {months: [11, 12, 1, 2, 3]}
    # Dates shown in the app but kept out of change statistics. Each needs a reason backed by numbers.
    flags:
      "2026-06-18": "Scene-wide HV haze: AOI median HV -14.2 dB vs about -21 dB on all other dates, HV floor -24 vs -26 dB. Likely a noise-floor or calibration artifact, not surface change."

  - id: kosi
    name: Kosi River floodplain, Bihar
    center: [26.0, 86.9]
    size_km: 40
    change_type: natural (monsoon inundation and retreat)
    status: primary
    products: [GCOV]
    stack: {track: 170, dir: A, frame: 15, bw: "40+5"}  # confirmed at gate 1
    # Rewind radar: peak monsoon (August) each year plus one dry-season month, all on orbit 12 A,
    # which has a full-AOI pass in every August and March 2015 to 2026 (survey 2026-11-15). Dual-pol starts in 2017.
    s1: {orbit: 12, dir: A, month: 8, extra: ["2026-03"]}
    # Rewind optical: dry-season composites, plus one raw peak-monsoon scene to show why radar matters.
    optical: {months: [2, 3, 4], monsoon: "2026-08"}  # Feb to Apr: after winter fog (Nov to Jan washes composites out), before the monsoon

  # Center = USGS us6000t7zp, M7.5, 2026-06-24 22:05:04 UTC, 20 km W of Catia La Mar.
  # Second mainshock us6000t7zc, M7.2, 2026-06-24 22:04:31 UTC, at 10.3713 N 68.5564 W (outside this AOI).
  - id: venezuela-eq
    name: Venezuela earthquakes, Jun 2026
    center: [10.5955, -67.2205]
    size_km: 30
    change_type: deformation (InSAR)
    status: stretch
    event_date: 2026-06-24
    products: [GCOV, GUNW]
    stack: {track: 126, dir: D, frame: 83, bw: "40+5"}  # GUNW 2026-06-22 to 07-04 spans the event

  - id: amazon-front
    name: Rondonia deforestation front
    center: [-9.5, -63.0]
    size_km: 40
    change_type: forest loss (HV drop)
    status: backup
    products: [GCOV]
